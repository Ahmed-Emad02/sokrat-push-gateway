; PROTOTYPE: no installer; do not enable on a live PBX without acceptance.
; Entered only after FreePBX's forward/DND checks and initial dstring lookup.
[sub-sokrat-wake-prepare]
exten => s,1,Set(SOKRAT_WAKE_ARMED=0)
 same => n,Set(__SOKRAT_WAKE_BASELINE=${DSTRING})
 same => n,AGI(sokrat-wake-agi.py,prepare,${ARG1})
 same => n,GotoIf($["${SOKRAT_WAKE_ARMED}"!="1"]?done)
 same => n,Set(__SOKRAT_WAKE_ENDPOINT=${SOKRAT_WAKE_ENDPOINT})
 same => n,Gosub(sub-sokrat-push-send,s,1(${ARG1}))
 same => n,Set(DSTRING=${IF($["${DSTRING}"=""]?Local/${ARG1}@sub-sokrat-wake-late/n:${DSTRING}&Local/${ARG1}@sub-sokrat-wake-late/n)})
 same => n(done),Return()

; This private context is not included in from-internal or outbound routing.
[sub-sokrat-wake-late]
exten => _X!,1,Set(SOKRAT_WAKE_CONTACT=)
 same => n,AGI(sokrat-wake-agi.py,wait,${EXTEN})
 same => n,GotoIf($["${SOKRAT_WAKE_CONTACT}"=""]?done)
 same => n,Dial(${SOKRAT_WAKE_CONTACT},,b(func-apply-sipheaders^s^1))
 same => n(done),Hangup()
