[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/nginx.stdout.log
stderr_logfile=/var/log/sokrat/nginx.stderr.log
priority=10

[program:coturn]
command=/usr/bin/turnserver -c /etc/turnserver.conf --pidfile=
user=turnserver
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/coturn.stdout.log
stderr_logfile=/var/log/sokrat/coturn.stderr.log
priority=20

[program:sokrat-push-gateway]
command=/usr/bin/node src/index.js
directory=/opt/sokrat-push-gateway
user=sokrat-push
environment=NODE_ENV="production",PORT="8095"
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/push-gateway.stdout.log
stderr_logfile=/var/log/sokrat/push-gateway.stderr.log
priority=30

[program:sokrat-gateway-control]
command=/bin/sh -c 'set -a; . /etc/sokrat/gateway-control.env; set +a; exec /usr/bin/node src/control-server.js'
directory=/opt/sokrat-push-gateway
user=sokrat-push
environment=NODE_ENV="production",CONTROL_PORT="9096",TENANT_PORT="9097",CONTROL_DATA_FILE="/var/lib/sokrat-gateway/control.json",TENANT_RUNTIME_FILE="/var/lib/sokrat-gateway/tenant-runtime.json"
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/gateway-control.stdout.log
stderr_logfile=/var/log/sokrat/gateway-control.stderr.log
priority=40

[program:sokrat-tenant-onboarding]
command=/usr/bin/python3 /usr/local/lib/sokrat-tenant-provisioning/provisioning-onboarding.py
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/onboarding.stdout.log
stderr_logfile=/var/log/sokrat/onboarding.stderr.log
priority=50

[program:sokrat-tenant-reconcile]
command=/usr/local/bin/reconcile-loop.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/sokrat/reconcile.stdout.log
stderr_logfile=/var/log/sokrat/reconcile.stderr.log
priority=60
