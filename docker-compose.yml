services:
  gateway-db:
    image: mariadb:11.4
    container_name: sokrat-gateway-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      - MARIADB_DATABASE=${DB_NAME:-asterisk}
      - MARIADB_USER=${DB_USER:-sokrat}
      - MARIADB_PASSWORD=${DB_PASS:?DB_PASS is required}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - gateway-db:/var/lib/mysql
      - ./sql/mobile_devices.sql:/docker-entrypoint-initdb.d/01-mobile_devices.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  sokrat-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOKRAT_UID: ${SOKRAT_UID:-999}
        SOKRAT_GID: ${SOKRAT_GID:-999}
    image: sokrat/push-gateway:latest
    container_name: sokrat-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      gateway-db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8095
      - CONTROL_PORT=${CONTROL_PORT:-8002}
      - CONTROL_LISTEN_HOST=127.0.0.1
      - CONTROL_ALLOW_PUBLIC=${CONTROL_ALLOW_PUBLIC:-true}
      - CONTROL_TRUST_PROXY=true
      - CONTROL_COOKIE_SECURE=true
      - TENANT_PORT=9097
      - GATEWAY_PUBLIC_HOST=${GATEWAY_PUBLIC_HOST:-127.0.0.1}
      - GATEWAY_HTTP_PORT=${GATEWAY_HTTP_PORT:-80}
      - GATEWAY_WS_PORT=${GATEWAY_WS_PORT:-8088}
      - GATEWAY_TLS_ENABLED=${GATEWAY_TLS_ENABLED:-auto}
      - GATEWAY_HTTPS_PORT=${GATEWAY_HTTPS_PORT:-443}
      - GATEWAY_WSS_PORT=${GATEWAY_WSS_PORT:-8089}
      - GATEWAY_LISTEN_IP=${GATEWAY_LISTEN_IP:-0.0.0.0}
      - GATEWAY_PRIVATE_IP=${GATEWAY_PRIVATE_IP:-127.0.0.1}
      - DB_HOST=127.0.0.1
      - DB_PORT=${DB_PORT:-3307}
      - DB_USER=${DB_USER:-sokrat}
      - DB_PASS=${DB_PASS:?DB_PASS is required}
      - DB_NAME=${DB_NAME:-asterisk}
      - AMI_HOST=${AMI_HOST:-127.0.0.1}
      - AMI_PORT=${AMI_PORT:-5038}
      - AMI_USER=${AMI_USER:-}
      - AMI_PASS=${AMI_PASS:-}
      - FCM_ENABLED=${FCM_ENABLED:-true}
      - APNS_ENABLED=${APNS_ENABLED:-false}
      - SOKRAT_HEARTBEAT_ENABLED=${SOKRAT_HEARTBEAT_ENABLED:-true}
      - SOKRAT_HEARTBEAT_STALE_MS=${SOKRAT_HEARTBEAT_STALE_MS:-60000}
      - SOKRAT_HEARTBEAT_TICK_MS=${SOKRAT_HEARTBEAT_TICK_MS:-30000}
      - SOKRAT_HEARTBEAT_PBX_IDS=${SOKRAT_HEARTBEAT_PBX_IDS:-}
    volumes:
      - /etc/sokrat:/etc/sokrat
      - /var/lib/sokrat-gateway:/var/lib/sokrat-gateway
      - /var/lib/sokrat-tenant-provisioning:/var/lib/sokrat-tenant-provisioning
      - /var/log/sokrat:/var/log/sokrat
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  gateway-db:
