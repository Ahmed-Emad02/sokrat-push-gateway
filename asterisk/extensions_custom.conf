; ============================================================================
; Sokrat VOICE push-to-wake dialplan hook
; ----------------------------------------------------------------------------
; Fire a background, non-blocking webhook to the push gateway so it can
; dispatch an APNs/FCM VoIP push to the callee's mobile device(s). The app
; wakes, reconnects to Asterisk over WSS, and rings natively via CallKit /
; Telecom — even from a cold / backgrounded state.
;
; Add this snippet to  /etc/asterisk/extensions_custom.conf
; Then in the [macro-exten-vm]: or your outbound/inbound route block:
;   same => n,Macro(sokrat-push-hook)
; ============================================================================

[macro-sokrat-push-hook]
; Called from predial / preanswer. No progress audio has been sent yet so the
; push happens silently and the caller keeps hearing normal ringback.
exten => s,1,NoOp(=== Sokrat Push Wake-Up Hook ===)
same => n,Set(_SOKRAT_CALLEE=${MACRO_EXTEN})
same => n,Set(_SOKRAT_CALLER=${CALLERID(num)})
same => n,Set(_SOKRAT_CALLER_NAME=${URIENCODE(${CALLERID(name)})})
; Fire-and-forget: 1s max, fully backgrounded in shell so it never blocks the pbx.
same => n,System(nohup /usr/bin/curl -s --max-time 1 "http://127.0.0.1:8095/api/push/incoming-call?callee=${_SOKRAT_CALLEE}&caller=${_SOKRAT_CALLER}&callerName=${_SOKRAT_CALLER_NAME}" >/dev/null 2>&1 &)
same => n,MacroExit()

; ----------------------------------------------------------------------------
; Optional: hook into the standard extension-to-extension predial flow.
; If your context routes mobil extensions through a [macro-dialout-one-predial-hook],
; define it here instead (uncomment and adjust).
; ----------------------------------------------------------------------------
;[macro-dialout-one-predial-hook]
;exten => s,1,NoOp(--- Sokrat Push Notification Wake-Up Hook ---)
;same => n,Set(TARGET_EXT=${DEXTEN})
;same => n,System(nohup /usr/bin/curl -s --max-time 1 "http://127.0.0.1:8095/api/push/incoming-call?callee=${TARGET_EXT}&caller=${CALLERID(num)}&callerName=${URIENCODE(${CALLERID(name)})}" >/dev/null 2>&1 &)
;same => n,MacroExit()
