limit_conn_zone $binary_remote_addr zone=sokrat_ws:10m;
limit_req_zone $binary_remote_addr zone=push_reg:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location = /health {
        proxy_pass http://127.0.0.1:8095/health;
        proxy_set_header Host $host;
    }

    location = /api/push/register-device {
        limit_req zone=push_reg burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location = /api/push/remove-device {
        limit_req zone=push_reg burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location = /api/push/incoming-call {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
    }

    location /api/push/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
    }

    location = /api/mobile/ice {
        limit_req zone=push_reg burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/extension/v1/contacts {
        limit_except GET { deny all; }
        limit_req zone=push_reg burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location /api/gateway/ {
        limit_req zone=push_reg burst=20 nodelay;
        proxy_pass http://127.0.0.1:9097;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 8088 default_server;

    location = /ws {
        access_log off;
        limit_conn sokrat_ws 10;
        if ($http_upgrade !~* "^websocket$") { return 426; }

        set $sokrat_ws_upstream http://127.0.0.1:9097;
        set $sokrat_ws_host 127.0.0.1:9097;

        if ($arg_ticket != "") {
            set $sokrat_ws_upstream http://127.0.0.1:9097;
            set $sokrat_ws_host 127.0.0.1:9097;
        }

        proxy_pass $sokrat_ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $sokrat_ws_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
