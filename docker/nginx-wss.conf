# Managed by Sokrat configure-gateway-tls.sh
# Public employee HTTPS and WSS endpoints; no dashboard or legacy webhook.
# TLS certificates are issued on the host and copied to /etc/sokrat/tls by the
# certbot deploy hook; /etc/sokrat is mounted into the gateway container.
limit_conn_zone $binary_remote_addr zone=sokrat_wss:10m;
limit_req_zone $binary_remote_addr zone=sokrat_https:10m rate=10r/s;

server {
    listen ${GATEWAY_HTTPS_PORT} ssl default_server;

    ssl_certificate ${GATEWAY_TLS_DIR}/fullchain.pem;
    ssl_certificate_key ${GATEWAY_TLS_DIR}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sokrat_https_cache:10m;
    ssl_session_timeout 1h;

    # Control dashboard over the same HTTPS origin as the per-PBX proxies.
    # SameSite=Strict cookies are scheme-sensitive; serving both over HTTPS is
    # what makes the "Open Sokrat VOIP" session gate work.
    location = /control { return 301 /control/; }

    location /control/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location /api/gateway/ {
        access_log off;
        limit_req zone=sokrat_https burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}

server {
    listen ${GATEWAY_WSS_PORT} ssl default_server;

    ssl_certificate ${GATEWAY_TLS_DIR}/fullchain.pem;
    ssl_certificate_key ${GATEWAY_TLS_DIR}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sokrat_wss_cache:10m;
    ssl_session_timeout 1h;

    location = /ws {
        access_log off;
        limit_conn sokrat_wss 10;
        if ($http_upgrade !~* "^websocket$") { return 426; }

        set $sokrat_ws_upstream http://127.0.0.1:9097;
        set $sokrat_ws_host 127.0.0.1:9097;

        proxy_pass $sokrat_ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $sokrat_ws_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
